# Integration tests run against a real PostgreSQL (local or CI service container).
main.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/wootify_test}
main.datasource.username=${TEST_DB_USER:pgadmin}
main.datasource.password=${TEST_DB_PASSWORD:pgadmin}

vaadin.launch-browser=false
logging.level.eclipselink.logging.sql=warn
logging.level.io.jmix=warn
wootify.market-data.source=test

# Движок в тестах управляется вручную: тесты создают супервизоры как отдельные экземпляры приложения.
wootify.bots.enabled=false
wootify.bots.instance-id=test-main
wootify.bots.reconcile-interval=200ms
wootify.bots.lease-duration=3s
wootify.bots.stop-timeout=5s
wootify.bots.shutdown-timeout=5s
wootify.bots.restart-backoff=300ms
wootify.bots.max-restart-backoff=1s
