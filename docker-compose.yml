services:

  wootify:
    build: .
    command: ["java", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005", "-Dconfig.file=/app/config/application-prod.properties", "-jar", "wootify.jar"]
    volumes:
      - './src/main/resources/application-prod.properties:/app/config/application-prod.properties'
      - ./sources:/app/sources
    restart: always
    container_name: wootify
    ports:
      - "8088:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PG_DATASOURCE_URL=jdbc:postgresql://wootify-db:5432/wootify
      - PG_NAME=pgadmin
      - PG_PASS=pgadmin
      - APP_API_KEY=woofipro
      - WOOFI_BRIDGE_BASE_URL=http://woofipro-bridge:8081
      - WOOFI_BRIDGE_API_KEY=woofipro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:192.168.88.151"
    tty: true
    depends_on:
      - wootify-db

  wootify-db:
    build:
      dockerfile: ./Dockerfile
      context: postgres
    restart: always
    container_name: wootify-db
    ports:
      - "25438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    environment:
      - POSTGRES_USER=pgadmin
      - POSTGRES_PASSWORD=pgadmin
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "kuramshin.py@yandex.ru"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5056:80"
    depends_on:
      - wootify-db

  woofipro-bridge:
    build:
      context: ./woofipro-bridge
      dockerfile: Dockerfile
    image: woofipro-bridge:local
    container_name: woofipro-bridge
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  pgadmin_data:
    driver: local