# Все секреты задаются в файле .env (см. .env.example).
# Наружу публикуется только UI приложения; БД и мост доступны лишь внутри сети compose.
services:

  wootify:
    build: .
    container_name: wootify
    hostname: wootify
    restart: unless-stopped
    ports:
      - "${WOOTIFY_PORT:-8088}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PG_DATASOURCE_URL: jdbc:postgresql://wootify-db:5432/wootify
      PG_NAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      PG_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      WOOFI_BRIDGE_BASE_URL: http://woofipro-bridge:8081
      WOOFI_BRIDGE_API_KEY: ${BRIDGE_API_KEY:?BRIDGE_API_KEY is required}
      WOOTIFY_INSTANCE_ID: ${WOOTIFY_INSTANCE_ID:-wootify-1}
      WOOTIFY_ENCRYPTION_KEY: ${WOOTIFY_ENCRYPTION_KEY:?WOOTIFY_ENCRYPTION_KEY is required}
      WOOTIFY_ADMIN_PASSWORD: ${WOOTIFY_ADMIN_PASSWORD:-}
    depends_on:
      wootify-db:
        condition: service_healthy
      woofipro-bridge:
        condition: service_started

  wootify-db:
    build:
      context: postgres
      dockerfile: ./Dockerfile
    container_name: wootify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      # Только для локальной отладки: доступно с хоста, но не из внешней сети.
      - "127.0.0.1:25438:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  woofipro-bridge:
    build:
      context: ./woofipro-bridge
      dockerfile: Dockerfile
    image: woofipro-bridge:local
    container_name: woofipro-bridge
    restart: unless-stopped
    environment:
      APP_API_KEY: ${BRIDGE_API_KEY:?BRIDGE_API_KEY is required}
      EXCHANGE_ID: woofipro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # Запуск: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4
    profiles: [ "tools" ]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5056:80"
    depends_on:
      - wootify-db

volumes:
  postgres_data:
  pgadmin_data:
